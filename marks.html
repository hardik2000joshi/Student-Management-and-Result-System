<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marks | Student Management System</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <h2>SMS</h2>

        <ul>

            <li><a href="index.html">Dashboard</a></li>

            <li><a href="students.html">Students</a></li>

            <li><a href="attendance.html">Attendance</a></li>

            <li><a href="marks.html" class="active">Marks</a></li>

            <li><a href="results.html">Results</a></li>

            <li><a href="about.html">About</a></li>

        </ul>

    </aside>

    <!-- Main Content -->

    <main class="main">

        <header class="header">

            <h1>Marks Management</h1>

        </header>

        <!-- Marks Form -->

        <section class="table-section">

            <h2>Enter Student Marks</h2>

            <form id="marksForm">

                <div class="form-group">

                    <select id="rollNo" required>

                        <option value="">Select Roll Number</option>

                    </select>

                    <input
                    type="text"
                    id="studentName"
                    placeholder="Student Name"
                    readonly>

                </div>

                <div class="form-group">

                    <input
                    type="number"
                    id="subject1"
                    placeholder="Subject 1"
                    min="0"
                    max="100"
                    required>

                    <input
                    type="number"
                    id="subject2"
                    placeholder="Subject 2"
                    min="0"
                    max="100"
                    required>

                </div>

                <div class="form-group">

                    <input
                    type="number"
                    id="subject3"
                    placeholder="Subject 3"
                    min="0"
                    max="100"
                    required>

                    <input
                    type="number"
                    id="subject4"
                    placeholder="Subject 4"
                    min="0"
                    max="100"
                    required>

                </div>

                <div class="form-group">

                    <input
                    type="number"
                    id="subject5"
                    placeholder="Subject 5"
                    min="0"
                    max="100"
                    required>

                </div>

                <button type="submit">

                    Save Marks

                </button>

            </form>

        </section>

        <br>
        <br>

        <!-- Marks Table -->

        <section class="table-section">

            <h2>Marks Records</h2>

            <table>

                <thead>

                    <tr>

                        <th>Roll No</th>

                        <th>Name</th>

                        <th>Sub 1</th>

                        <th>Sub 2</th>

                        <th>Sub 3</th>

                        <th>Sub 4</th>

                        <th>Sub 5</th>

                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="marksTable">

                </tbody>

            </table>

        </section>

    </main>

</div>

<script src="marks.js"></script>
</body>
</html>
