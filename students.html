<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <h2>SMS</h2>

        <ul>

            <li><a href="index.html">Dashboard</a></li>

            <li><a href="students.html" class="active">Students</a></li>

            <li><a href="attendance.html">Attendance</a></li>

            <li><a href="marks.html">Marks</a></li>

            <li><a href="results.html">Results</a></li>

            <li><a href="about.html">About</a></li>

        </ul>

    </aside>

    <!-- Main -->

    <main class="main">

        <header class="header">

            <h1>Student Management</h1>

        </header>


        <!-- Student Form -->

        <section class="table-section">

            <h2>Add Student</h2>

            <form id="studentForm">

                <div class="form-group">
                        <input
    type="text"
    id="rollNo"
    placeholder="Roll Number"
    required>

       <input
       type="text"
       id="name"
       placeholder="Student Name"
       required>
                </div>

                <div class="form-group">
                    <select id="course" required>

    <option value="">Select Course</option>

    <option>MCA</option>

    <option>BCA</option>

    <option>B.Tech</option>

    <option>B.Sc</option>

</select>
                   <select id="semester" required>

    <option value="">Select Semester</option>

    <option>1</option>

    <option>2</option>

    <option>3</option>

    <option>4</option>

    <option>5</option>

    <option>6</option>

</select>

                </div>

                <div class="form-group">

                    <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required>

                    <input
                    type="text"
                    id="phone"
                    placeholder="Phone Number"
                    required>

                </div>

                <button type="submit">

                    Save Student

                </button>

            </form>

        </section>

        <br>
        <br>


        <!-- Search -->

        <section class="table-section">

            <h2>Search Student</h2>

            <input
            type="text"
            id="search"
            placeholder="Search by Roll Number or Name">

        </section>

        <br>
        <br>


        <!-- Student Table -->

        <section class="table-section">

            <h2>Student Records</h2>

            <table>

                <thead>

                    <tr>

                        <th>Roll No</th>

                        <th>Name</th>

                        <th>Course</th>

                        <th>Semester</th>

                        <th>Email</th>

                        <th>Phone</th>

                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody id="studentTable">

                </tbody>

            </table>

        </section>

    </main>

</div>
<script src="students.js"></script>
</body>
</html>
